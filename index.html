<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Gestão New Gears</title> 
    
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <style>
      .startup-message { box-sizing: border-box; max-width: 620px; margin: 10vh auto; padding: 32px; border: 1px solid #3a4964; border-radius: 24px; color: #f1f5f9; background: #141b2b; font: 16px/1.6 system-ui, sans-serif; }
      .startup-message h1 { font-size: 26px; line-height: 1.3; }
      .startup-message a { display: inline-block; margin-top: 16px; padding: 10px 16px; border-radius: 12px; background: #b5f2fb; color: #122034; font-weight: 700; }
      @media(max-width: 660px) { .startup-message { margin: 24px 12px; padding: 24px; } }
    </style>
</head>
  <body>
    <div id="root">
      <section class="startup-message" role="status" aria-live="polite">
        <h1 data-startup-title>Abrindo a base New Gears…</h1>
        <p data-startup-description>Se o carregamento não terminar, confira sua conexão e tente novamente.</p>
        <a href="">Tentar abrir novamente</a>
      </section>
    </div>
    <noscript>Ative o JavaScript no navegador para acessar a base New Gears.</noscript>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
